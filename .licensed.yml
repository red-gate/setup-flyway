sources:
  npm: true

allowed:
  - apache-2.0
  - 0bsd
  - bsd-2-clause
  - bsd-3-clause
  - blueoak-1.0.0
  - isc
  - mit
  - cc0-1.0
  - unlicense

reviewed:
  npm:
    # lightningcss (pulled in by vite) is MPL-2.0, but it's a dev-only dependency that is never shipped in distributed output
    - lightningcss
    - lightningcss-android-arm64
    - lightningcss-darwin-arm64
    - lightningcss-darwin-x64
    - lightningcss-freebsd-x64
    - lightningcss-linux-arm-gnueabihf
    - lightningcss-linux-arm64-gnu
    - lightningcss-linux-arm64-musl
    - lightningcss-linux-x64-gnu
    - lightningcss-linux-x64-musl
    - lightningcss-win32-arm64-msvc
    - lightningcss-win32-x64-msvc
    # These dependencies don't have resolvable licenses, but have been explicitly verified as allowed
    - "@actions/http-client@4.0.1"
    - "@protobuf-ts/runtime@2.11.1"
    - "abbrev@5.0.0"
    - "balanced-match@4.0.4"
    - "brace-expansion@5.0.12"
    - "chownr@3.0.0"
    - "isexe@4.0.0"
    - "minimatch@10.2.6"
    - "minipass@7.1.3"
    - "minizlib@3.1.0"
    - "tar@7.5.22"
    - "yallist@5.0.0"
