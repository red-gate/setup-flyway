cacheFolder: ./.yarn/cache

changesetIgnorePatterns:
  - .github/**
  - .yarn/cache/**

compressionLevel: mixed

defaultSemverRangePrefix: ""

nodeLinker: node-modules

patchFolder: ./.yarn/patches

preferInteractive: true

supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  os:
    - current
    - darwin
    - linux
    - win32
